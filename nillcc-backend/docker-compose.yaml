services:
  api:
    build:
      # Build from the repo ROOT so the workspace sibling packages
      # (../contracts, ../shared) are available as `file:` deps and
      # contracts/dist can be produced inside the image.
      context: ..
      dockerfile: nillcc-backend/Dockerfile
    container_name: s3ntiment
    ports:
      - "8088:8080"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    # Uncomment if you need to persist data
    # volumes:
    #   - ./data:/app/data
    networks:
      - nillion-network

networks:
  nillion-network:
    driver: bridge