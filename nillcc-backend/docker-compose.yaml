# nillcc-backend/docker-compose.yaml — bring up the backend from the ISOLATED
# deploy layout. deploy.sh ships exactly these folders to the host root:
#
#   /srv/s3ntiment/backend/
#     nillcc-backend/   Dockerfile, docker-compose.yaml, package.json,
#                       pnpm-lock.yaml, src/ ...
#     shared/           @s3ntiment/shared source (backend dep: file:../shared)
#     contracts/        s3ntiment-contracts source (backend dep: file:../contracts)
#     .dockerignore     build-context ignore list
#
# build.context is ".." (the isolated deploy root) so Docker sees the sibling
# folders the Dockerfile needs. The image itself is fully self-contained: no
# pnpm workspace, no repo-root context, no other workspace members.
#
# From the host:  cd /srv/s3ntiment/backend/nillcc-backend && docker compose up -d --build

services:
  s3ntiment:
    build:
      context: ..
      dockerfile: nillcc-backend/Dockerfile
    container_name: s3ntiment
    ports:
      - "8088:8080"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
